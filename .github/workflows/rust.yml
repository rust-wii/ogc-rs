# Rust CI

name: Rust CI
on: [push, pull_request]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    container:
      image: "devkitpro/devkitppc:latest"
    steps:
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev nodejs clang

      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Run cargo check
        run: cargo check -Zjson-target-spec

      - name: Run cargo check with all features
        run: cargo check -Zjson-target-spec --all-features

  lints:
    name: Lints
    runs-on: ubuntu-latest
    container:
      image: "devkitpro/devkitppc:latest"
    steps:
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev nodejs clang

      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rust-src

      - name: Run cargo clippy
        run: cargo clippy -Zjson-target-spec

      - name: Run cargo clippy with all features
        run: cargo clippy -Zjson-target-spec --all-features

